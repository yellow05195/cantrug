<!doctype html>
<!-- X (Twitter) header, 1500 x 500, built like the site's hero: the page ground, the hero headline, the cube.
     The profile already shows the name and the mark, so the banner carries only the line and the cube.
     The avatar covers the bottom-left corner, so the words end above y=320. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{width:1500px;height:500px;overflow:hidden;font-family:Rubik,sans-serif;background:#f4f5f7;color:#121318;position:relative}
.words{position:absolute;left:104px;top:62px}
h1{margin:0;font-weight:900;font-size:84px;line-height:.94;letter-spacing:-.05em}
h1 span{color:#ff6a13}
.cube{position:absolute;right:120px;top:14px}
</style></head><body>
<div class="words">
  <h1>Pump burns your<br>dead money.<br><span>We give it back.</span></h1>
</div>
<svg class="cube" width="440" height="478" viewBox="0 0 64 69.5"></svg>
<script>
// the logo face, same as the site
const FACE=["#ffffff","#12b05a","#1f5fd6","#ffd23f","#ffffff","#e5322b","#ff6a13","#ff6a13","#ff6a13"];
// an isometric cube with rounded stickers in the logo's colours
const K="#111216";
const shade=(hex,k)=>"#"+[1,3,5].map(i=>Math.round(parseInt(hex.slice(i,i+2),16)*k).toString(16).padStart(2,"0")).join("");
function stickers(o,u,v,cols,k=1){
  cols=cols.map(c=>shade(c,k));
  let s="";const g=0.085;
  for(let i=0;i<3;i++)for(let j=0;j<3;j++){
    const P=(x,y)=>[o[0]+u[0]*x+v[0]*y,o[1]+u[1]*x+v[1]*y];
    const a=i/3+g/2,b=(i+1)/3-g/2,c=j/3+g/2,d=(j+1)/3-g/2;
    const q=[P(a,c),P(b,c),P(b,d),P(a,d)].map(p=>p.map(n=>n.toFixed(2)).join(" "));
    s+=`<path d="M${q.join("L")}Z" fill="${cols[i*3+j]}" stroke="${cols[i*3+j]}" stroke-width="1.1" stroke-linejoin="round"/>`;
  }
  return s;
}
const w=26,h=30,t=[32,4];
const L=[t[0]-w,t[1]+w*0.5774],F=[t[0],t[1]+w*1.1547],R=[t[0]+w,t[1]+w*0.5774];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
// the soft grey shadow of the site's hero cube, on the same light ground
let s=`<defs><filter id="blur" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="1.6"/></filter></defs>`;
s+=`<ellipse cx="32" cy="${F[1]+h+3}" rx="21" ry="2.6" fill="#121318" opacity=".18" filter="url(#blur)"/>`;
s+=`<path d="M${[t,R,[R[0],R[1]+h],[F[0],F[1]+h],[L[0],L[1]+h],L].map(p=>p.join(" ")).join("L")}Z" fill="${K}" stroke="${K}" stroke-width="2.4" stroke-linejoin="round"/>`;
// the front face is the logo's face; the bottom row stays orange all round, the floor
const W="#ffffff",G="#12b05a",B="#1f5fd6",Y="#ffd23f",Rd="#e5322b",O="#ff6a13";
const cols=(rows)=>[0,1,2].flatMap((c)=>[0,1,2].map((r)=>rows[r*3+c])); // row-major to stickers() order
s+=stickers(L,sub(t,L),sub(F,L),cols([B,W,G, Rd,B,Y, G,W,B]));
s+=stickers(L,sub(F,L),[0,h],cols(FACE),.93);
s+=stickers(F,sub(R,F),[0,h],cols([Rd,B,W, G,Rd,Y, O,O,O]),.78);
document.querySelector(".cube").innerHTML=s;
</script>
</body></html>
