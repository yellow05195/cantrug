services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: floored
      POSTGRES_PASSWORD: floored
      POSTGRES_DB: floored
    ports:
      - "5432:5432"
    volumes:
      - floored-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floored"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  floored-pg:
